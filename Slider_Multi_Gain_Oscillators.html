<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slider Multi-Gain Oscillators</title>
    <style>
      body {
        font-family:'Courier', Courier, monospace;
        padding: 20px;
        background-color:purple;
        color: orange;
      }
    </style>
  </head>
  
  <body>
    <div class = "slider-container">
      <h1>Pitch Oscillators</h1>
<p>
      <input id="freq" type="range" min="1" max="10" value="1" step="0.1" /><label
      id="freqDisplay"
      >1</label
    > <p>

      <p>

    <input
      id="freq2"
      type="range"
      min="1"
      max="10"
      value="1"
      step="0.1"
    /><label id="freqDisplay2">1</label> </p>

    </p>

    <input
      id="freq3"
      type="range"
      min="1"
      max="10"
      value="1"
      step="0.1"
    /><label id="freqDisplay3">1</label>

    </p>

    </p>
    <input
      id="freq4"
      type="range"
      min="1"
      max="10"
      value="1"
      step="0.1"
    /><label id="freqDisplay4">1</label> </p> </div>

    <div class = "gain-container">
      <h1>Gain Oscillators</h1>

    <p>
    <input
      id="gain"
      type="range"
      min="0"
      max="1"
      value="0.1"
      step="0.01"
    /><label id="gainDisplay1">0.1</label> </p>

    </p>
    <input
      id="gain2"
      type="range"
      min="0"
      max="1"
      value="0.1"
      step="0.01"
    /><label id="gainDisplay2">0.1</label> </p>

    </p>
    <input
      id="gain3"
      type="range"
      min="0"
      max="1"
      value="0.1"
      step="0.01"
    /><label id="gainDisplay3">0.1</label> </p>

    </p>
    <input
      id="gain4"
      type="range"
      min="0"
      max="1"
      value="0.1"
      step="0.01"
    /><label id="gainDisplay4">0.1</label> </p>

    <script>
      const ctx = new AudioContext();
      ctx.suspend();

      // first set of oscillators

      let freq = 130.81; // C3

      const osc1 = new OscillatorNode(ctx);
      osc1.type = "sine";
      osc1.frequency.value = freq;

      const osc2 = new OscillatorNode(ctx);
      osc2.type = "sine";
      osc2.frequency.value = freq * 2;

      const osc3 = new OscillatorNode(ctx);
      osc3.type = "sine";
      osc3.frequency.value = freq * 2;

      const gain1 = new GainNode(ctx);
      gain1.gain.value = 0.1;

      osc1.connect(gain1);
      osc2.connect(gain1);
      osc3.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start();
      osc2.start();
      osc3.start();

      // Second set of oscillators

      let freq2 = 164.81; // E3

      const osc4 = new OscillatorNode(ctx);
      osc4.type = "sine";
      osc4.frequency.value = freq2;

      const osc5 = new OscillatorNode(ctx);
      osc5.type = "sine";
      osc5.frequency.value = freq2 * 2;

      const osc6 = new OscillatorNode(ctx);
      osc6.type = "sine";
      osc6.frequency.value = freq2 * 3;

      const gain2 = new GainNode(ctx);
      gain2.gain.value = 0.1;

      osc4.connect(gain2);
      osc5.connect(gain2);
      osc6.connect(gain2);
      gain2.connect(ctx.destination);
      osc4.start();
      osc5.start();
      osc6.start();

      // third set

      let freq3 = 196; // G3

      const osc7 = new OscillatorNode(ctx);
      osc7.type = "sine";
      osc7.frequency.value = freq3;

      const osc8 = new OscillatorNode(ctx);
      osc8.type = "sine";
      osc8.frequency.value = freq3 * 2;

      const osc9 = new OscillatorNode(ctx);
      osc9.type = "sine";
      osc9.frequency.value = freq3 * 3;

      const gain3 = new GainNode(ctx);
      gain3.gain.value = 0.1;

      osc7.connect(gain3);
      osc8.connect(gain3);
      osc9.connect(gain3);
      gain3.connect(ctx.destination);
      osc7.start();
      osc8.start();
      osc9.start();

      // fourth set

      let freq4 = 246.94; // B3

      const osc10 = new OscillatorNode(ctx);
      osc10.type = "sine";
      osc10.frequency.value = freq4;

      const osc11 = new OscillatorNode(ctx);
      osc11.type = "sine";
      osc11.frequency.value = freq4 * 2;

      const osc12 = new OscillatorNode(ctx);
      osc12.type = "sine";
      osc12.frequency.value = freq4 * 3;

      const gain4 = new GainNode(ctx);
      gain4.gain.value = 0.1;

      osc10.connect(gain4);
      osc11.connect(gain4);
      osc12.connect(gain4);
      gain4.connect(ctx.destination);
      osc10.start();
      osc11.start();
      osc12.start();

      // pitch sliders

      const slider1 = document.querySelector("#freq");
      slider1.addEventListener("input", () => {
        ctx.resume();
        osc1.frequency.value = freq * Number(slider1.value);
        osc2.frequency.value = freq * Number(slider1.value);
        osc3.frequency.value = freq * Number(slider1.value);
        document.querySelector("#freqDisplay").textContent = slider1.value;
      });

      const slider2 = document.querySelector("#freq2");
      slider2.addEventListener("input", () => {
        ctx.resume();
        osc4.frequency.value = freq2 * Number(slider2.value);
        osc5.frequency.value = freq2 * Number(slider2.value);
        osc6.frequency.value = freq2 * Number(slider2.value);
        document.querySelector("#freqDisplay2").textContent = slider2.value;
      });

      const slider3 = document.querySelector("#freq3");
      slider3.addEventListener("input", () => {
        ctx.resume();
        osc7.frequency.value = freq3 * Number(slider3.value);
        osc8.frequency.value = freq3 * Number(slider3.value);
        osc9.frequency.value = freq3 * Number(slider3.value);
        document.querySelector("#freqDisplay3").textContent = slider3.value;
      });

      const slider4 = document.querySelector("#freq4");
      slider4.addEventListener("input", () => {
        ctx.resume();
        osc10.frequency.value = freq4 * Number(slider4.value);
        osc11.frequency.value = freq4 * Number(slider4.value);
        osc12.frequency.value = freq4 * Number(slider4.value);
        document.querySelector("#freqDisplay4").textContent = slider4.value;
      });

      // gain sliders

      const gainSlider1 = document.querySelector("#gain");
      gainSlider1.addEventListener("input", () => {
        ctx.resume();
        gain1.gain.value = Number(gainSlider1.value);
        document.querySelector("#gainDisplay1").textContent = gainSlider1.value;
      });

      const gainSlider2 = document.querySelector("#gain2");
      gainSlider2.addEventListener("input", () => {
        ctx.resume();
        gain2.gain.value = Number(gainSlider2.value);
        document.querySelector("#gainDisplay2").textContent = gainSlider2.value;
      });

      const gainSlider3 = document.querySelector("#gain3");
      gainSlider3.addEventListener("input", () => {
        ctx.resume();
        gain3.gain.value = Number(gainSlider3.value);
        document.querySelector("#gainDisplay3").textContent = gainSlider3.value;
      });

      const gainSlider4 = document.querySelector("#gain4");
      gainSlider4.addEventListener("input", () => {
        ctx.resume();
        gain4.gain.value = Number(gainSlider4.value);
        document.querySelector("#gainDisplay4").textContent = gainSlider4.value;
      });
    </script>
  </body>
</html>
